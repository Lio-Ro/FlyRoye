<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fly Roye – Private Aviation & Luxury Travel</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      background: #050608;
      color: #f1f3f5;
      overflow-x: hidden;
      scroll-behavior: smooth;
    }

    /* BARRIEREFREIER UND INTERAKTIVER NAV-BEREICH */
    nav {
      position: fixed;
      top: 0;
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 25px 50px;
      z-index: 1000;
      background: rgba(5, 6, 8, 0.85);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(229, 207, 146, 0.15);
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.6);
    }

    .brand-title {
      font-weight: 300;
      font-size: 1.6rem;
      letter-spacing: 8px;
      text-transform: uppercase;
      color: #e5cf92;
      text-shadow: 0 0 15px rgba(229, 207, 146, 0.15);
    }

    nav div {
      display: flex;
      gap: 35px;
    }

    nav a {
      color: rgba(241, 243, 245, 0.6);
      text-decoration: none;
      font-weight: 500;
      font-size: 0.85rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      cursor: pointer;
      position: relative;
      transition: color 0.4s ease;
    }

    nav a::after {
      content: '';
      position: absolute;
      bottom: -4px;
      left: 0;
      width: 0;
      height: 1px;
      background: #e5cf92;
      transition: width 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    nav a:hover {
      color: #e5cf92;
    }

    nav a:hover::after {
      width: 100%;
    }

    /* HERO WILLKOMMENSANZEIGE */
    .hero {
      height: 100vh;
      background: linear-gradient(rgba(5, 6, 8, 0.3), #050608), 
        url('https://unsplash.com') center/cover;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 0 20px;
    }

    .hero h1 {
      font-size: 4.5rem;
      font-weight: 200;
      margin-bottom: 20px;
      letter-spacing: 12px;
      text-transform: uppercase;
      background: linear-gradient(135deg, #ffffff 0%, #e5cf92 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hero p {
      font-size: 1.25rem;
      font-weight: 300;
      max-width: 750px;
      margin-bottom: 45px;
      color: rgba(241, 243, 245, 0.7);
      letter-spacing: 1px;
      line-height: 1.8;
    }

    .hero button {
      padding: 18px 50px;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 3px;
      text-transform: uppercase;
      border: 1px solid #e5cf92;
      background: transparent;
      color: #e5cf92;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      z-index: 1;
      transition: all 0.4s ease;
    }

    .hero button::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(229, 207, 146, 0.2), transparent);
      transition: all 0.6s ease;
      z-index: -1;
    }

    .hero button:hover::before {
      left: 100%;
    }

    .hero button:hover {
      background: rgba(229, 207, 146, 0.05);
      box-shadow: 0 0 30px rgba(229, 207, 146, 0.3);
      transform: translateY(-2px);
    }

    /* SECTIONS */
    section {
      padding: 120px 40px;
      text-align: center;
    }

    section h2 {
      font-size: 2.4rem;
      font-weight: 300;
      margin-bottom: 15px;
      color: #ffffff;
      text-transform: uppercase;
      letter-spacing: 6px;
    }

    .section-subtitle {
      font-size: 1.05rem;
      color: rgba(241, 243, 245, 0.4);
      margin-bottom: 60px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    /* DIGITAL SAT MAP DISPLAY */
    #map-section {
      background: #090b0e;
      border-bottom: 1px solid rgba(212, 175, 55, 0.05);
    }

    .map-container {
      width: 100%;
      max-width: 1200px;
      margin: auto;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.7);
      border: 1px solid rgba(229, 207, 146, 0.15);
      overflow: hidden;
      transform: perspective(1000px) rotateX(2deg);
      transition: transform 0.5s ease;
    }

    .map-container:hover {
      transform: perspective(1000px) rotateX(0deg);
    }

    iframe {
      width: 100%;
      height: 60vh;
      border: none;
      display: block;
      filter: grayscale(1) invert(0.92) hue-rotate(180deg) brightness(0.95);
    }

    /* RASTER UND HOVER-EFFEKTE */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 35px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .card {
      background: rgba(255, 255, 255, 0.01);
      border: 1px solid rgba(229, 207, 146, 0.08);
      padding: 45px 35px;
      text-align: left;
      position: relative;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.4s ease, box-shadow 0.4s ease;
    }

    /* DYNAMISCHER CHAMPAGNER-GLOW UNTER DEM CURSOR */
    .card::before {
      content: '';
      position: absolute;
      top: var(--mouse-y, 0);
      left: var(--mouse-x, 0);
      width: 350px;
      height: 350px;
      background: radial-gradient(circle, rgba(229, 207, 146, 0.08) 0%, transparent 70%);
      transform: translate(-50%, -50%);
      opacity: 0;
      transition: opacity 0.4s ease;
      pointer-events: none;
      z-index: 0;
    }

    .card:hover::before {
      opacity: 1;
    }

    .card:hover {
      border-color: rgba(229, 207, 146, 0.6);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5), inset 0 0 15px rgba(229, 207, 146, 0.02);
      transform: translateY(-6px) scale(1.01);
    }

    .card * {
      position: relative;
      z-index: 1;
    }

    .card h3 {
      color: #ffffff;
      margin-bottom: 15px;
      font-size: 1.3rem;
      font-weight: 400;
      letter-spacing: 2px;
      text-transform: uppercase;
      border-left: 2px solid #e5cf92;
      padding-left: 15px;
      transition: color 0.3s ease, transform 0.3s ease;
    }

    .card:hover h3 {
      color: #e5cf92;
      transform: translateX(3px);
    }

    .card p {
      color: rgba(241, 243, 245, 0.55);
      line-height: 1.7;
      font-size: 0.95rem;
      font-weight: 300;
      margin-bottom: 20px;
      transition: color 0.3s ease;
    }

    .card:hover p {
      color: rgba(241, 243, 245, 0.8);
    }

    .click-details {
      font-size: 0.75rem;
      color: #e5cf92;
      text-transform: uppercase;
      letter-spacing: 2px;
      font-weight: 600;
      opacity: 0.4;
      transition: opacity 0.3s ease, letter-spacing 0.3s ease;
    }

    .card:hover .click-details {
      opacity: 1;
      letter-spacing: 3px;
    }

    /* PROFESSIONELLE KLICK-RÜCKMELDUNG */
    .card:active {
      transform: translateY(-2px) scale(0.99);
      background: rgba(229, 207, 146, 0.03);
    }

    /* REISEPAKETE */
    .card.featured {
      border: 1px solid rgba(229, 207, 146, 0.5);
      background: rgba(229, 207, 146, 0.01);
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
    }

    .card.featured:hover {
      border-color: #e5cf92;
    }

    .package-price {
      font-size: 2.8rem;
      color: #e5cf92;
      font-weight: 300;
      margin: 15px 0 5px 0;
      letter-spacing: 1px;
    }

    .package-duration {
      color: rgba(241, 243, 245, 0.35);
      margin-bottom: 30px;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 600;
    }

    .package-features {
      text-align: left;
      margin: 30px 0;
      border-top: 1px solid rgba(229, 207, 146, 0.1);
    }

    .package-features li {
      list-style: none;
      padding: 12px 0;
      border-bottom: 1px solid rgba(241, 243, 245, 0.03);
      font-size: 0.9rem;
      color: rgba(241, 243, 245, 0.65);
      padding-left: 20px;
      position: relative;
    }

    .package-features li:before {
      content: "—";
      position: absolute;
      left: 0;
      color: #e5cf92;
    }

    .package-card button {
      padding: 16px;
      background: transparent;
      color: #ffffff;
      border: 1px solid rgba(229, 207, 146, 0.3);
      cursor: pointer;
      width: 100%;
      font-weight: 500;
      text-transform: uppercase;
      font-size: 12px;
      letter-spacing: 2px;
      position: relative;
      overflow: hidden;
      z-index: 1;
      transition: all 0.4s ease;
    }

    .package-card button:hover {
      background: #e5cf92;
      color: #050608;
      border-color: #e5cf92;
      box-shadow: 0 10px 25px rgba(229, 207, 146, 0.25);
    }

    /* CHARTER-SYSTEMPLÄNE */
    #contact {
      background: #090b0e;
    }

    .contact-container {
      max-width: 650px;
      margin: 0 auto;
    }

    .contact-info {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 30px;
      margin-bottom: 40px;
    }

    .contact-item h4 {
      color: #e5cf92;
      margin-bottom: 8px;
      font-size: 0.95rem;
      text-transform: uppercase;
      font-weight: 500;
      letter-spacing: 2px;
    }

    .contact-item p {
      color: rgba(241, 243, 245, 0.6);
      font-size: 1.05rem;
    }

    input, textarea {
      width: 100%;
      padding: 16px;
      margin-bottom: 20px;
      background: rgba(5, 6, 8, 0.6);
      border: 1px solid rgba(229, 207, 146, 0.15);
      color: #ffffff;
      font-family: inherit;
      font-size: 15px;
      transition: all 0.3s ease;
    }

    input:focus, textarea:focus {
      outline: none;
      border-color: #e5cf92;
