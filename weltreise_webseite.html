<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fly Roye – Private Aviation & Luxury Travel</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      background: #03050a;
      color: #e2e8f0;
      overflow-x: hidden;
      scroll-behavior: smooth;
    }

    /* NAVBAR */
    nav {
      position: fixed;
      top: 0;
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 30px 60px;
      z-index: 1000;
      background: rgba(3, 5, 10, 0.75);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.03);
    }

    .brand-title {
      font-weight: 300;
      font-size: 1.6rem;
      letter-spacing: 8px;
      text-transform: uppercase;
      position: relative;
      color: #ffffff;
    }

    .brand-title::after {
      content: '';
      position: absolute;
      bottom: -6px;
      left: 0;
      width: 35px;
      height: 1px;
      background: linear-gradient(90deg, #d4af37, transparent);
    }

    nav div {
      display: flex;
      gap: 40px;
    }

    nav a {
      color: rgba(255, 255, 255, 0.6);
      text-decoration: none;
      font-weight: 400;
      font-size: 0.85rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.4s ease;
    }

    nav a:hover {
      color: #ffffff;
      letter-spacing: 3px;
    }

    /* HERO SECTION */
    .hero {
      height: 100vh;
      background: linear-gradient(rgba(3, 5, 10, 0.2), rgba(3, 5, 10, 1)),
        url('https://unsplash.com');
      background-size: cover;
      background-position: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 0 20px;
    }

    .hero h1 {
      font-size: 4.5rem;
      font-weight: 200;
      margin-bottom: 25px;
      letter-spacing: 12px;
      text-transform: uppercase;
      color: #ffffff;
    }

    .hero p {
      font-size: 1.2rem;
      font-weight: 300;
      letter-spacing: 1px;
      line-height: 1.8;
      color: rgba(255, 255, 255, 0.7);
      margin-bottom: 50px;
      max-width: 700px;
    }

    .hero button {
      padding: 20px 55px;
      font-size: 13px;
      font-weight: 400;
      letter-spacing: 3px;
      text-transform: uppercase;
      border-radius: 40px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(10px);
      color: #ffffff;
      cursor: pointer;
      transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .hero button:hover {
      transform: translateY(-2px);
      background: #ffffff;
      color: #03050a;
      box-shadow: 0 20px 40px rgba(255, 255, 255, 0.05);
    }

    /* SECTIONS */
    section {
      padding: 140px 60px;
      text-align: center;
    }

    section h2 {
      font-size: 2.2rem;
      font-weight: 300;
      margin-bottom: 80px;
      color: #ffffff;
      text-transform: uppercase;
      letter-spacing: 6px;
    }

    #destinations {
      background: #03050a;
    }

    .destinations-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 40px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .destination-card {
      background: rgba(255, 255, 255, 0.01);
      border: 1px solid rgba(255, 255, 255, 0.04);
      border-radius: 24px;
      padding: 45px;
      text-align: left;
      transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .destination-card:hover {
      transform: translateY(-5px);
      border-color: rgba(255, 255, 255, 0.15);
      background: rgba(255, 255, 255, 0.02);
    }

    .destination-card h3 {
      color: #ffffff;
      margin-bottom: 20px;
      font-size: 1.3rem;
      font-weight: 400;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .destination-card p {
      color: rgba(255, 255, 255, 0.6);
      line-height: 1.8;
      font-size: 0.95rem;
      font-weight: 300;
    }

    #experiences {
      background: #060910;
    }

    .experiences-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 35px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .experience-card {
      background: rgba(255, 255, 255, 0.01);
      border-radius: 24px;
      border: 1px solid rgba(255, 255, 255, 0.03);
      padding: 55px 40px;
      transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .experience-card:hover {
      border-color: rgba(255, 255, 255, 0.1);
      background: rgba(255, 255, 255, 0.02);
    }

    .radar-indicator {
      width: 12px;
      height: 12px;
      background-color: rgba(255,255,255,0.7);
      border-radius: 50%;
      margin: 0 auto 35px auto;
      position: relative;
    }

    .experience-card h3 {
      color: #ffffff;
      margin-bottom: 20px;
      font-size: 1.25rem;
      font-weight: 400;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .experience-card p {
      color: rgba(255, 255, 255, 0.55);
      line-height: 1.7;
      font-size: 0.95rem;
      font-weight: 300;
    }

    #packages {
      background: #03050a;
    }

    .packages-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
      gap: 40px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .package-card {
      background: rgba(255, 255, 255, 0.01);
      border: 1px solid rgba(255, 255, 255, 0.04);
      border-radius: 24px;
      padding: 55px 45px;
      transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .package-card.featured {
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(255, 255, 255, 0.02);
    }

    .package-card h3 {
      font-weight: 300;
      letter-spacing: 3px;
      text-transform: uppercase;
      font-size: 1.4rem;
    }

    .package-price {
      font-size: 2.8rem;
      color: #ffffff;
      font-weight: 200;
      margin: 30px 0 5px 0;
      letter-spacing: -1px;
    }

    .package-duration {
      color: rgba(255, 255, 255, 0.4);
      margin-bottom: 40px;
      font-size: 0.85rem;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .package-features {
      text-align: left;
      margin: 40px 0;
    }

    .package-features li {
      list-style: none;
      padding: 14px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.02);
      font-size: 0.95rem;
      color: rgba(255, 255, 255, 0.7);
      position: relative;
      padding-left: 25px;
      font-weight: 300;
    }

    .package-features li:before {
      content: "";
      position: absolute;
      left: 0;
      top: 50%;
      transform: translateY(-50%);
      width: 12px;
      height: 1px;
      background-color: rgba(255, 255, 255, 0.3);
    }

    .package-card button {
      padding: 18px;
      background: transparent;
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 30px;
      cursor: pointer;
      transition: all 0.4s ease;
      width: 100%;
      font-weight: 400;
      font-size: 13px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .package-card button:hover {
      background: #ffffff;
      color: #03050a;
      border-color: #ffffff;
    }

    #contact {
      background: #060910;
    }

    .contact-container {
      max-width: 600px;
      margin: 0 auto;
    }

    .contact-info {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 40px;
      margin-bottom: 60px;
    }

    .contact-item h4 {
      color: #ffffff;
      margin-bottom: 12px;
      font-size: 1rem;
      font-weight: 400;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .contact-item p {
      color: rgba(255, 255, 255, 0.6);
      font-size: 1rem;
      font-weight: 300;
    }

    input, textarea {
      width: 100%;
      padding: 18px;
      margin-bottom: 20px;
      background: rgba(255, 255, 255, 0.01);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 12px;
      color: white;
      font-family: inherit;
      font-size: 15px;
      transition: all 0.4s ease;
    }

    input:focus, textarea:focus {
      outline: none;
      border-color: rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.02);
    }

    form button {
      width: 100%;
      padding: 20px;
      border-radius: 35px;
      border: none;
      background: #ffffff;
      color: #03050a;
      font-weight: 400;
      font-size: 13px;
      letter-spacing: 2px;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.4s ease;
    }

    form button:hover {
      background: rgba(255, 255, 255, 0.85);
      transform: translateY(-1px);
    }

    footer {
      padding: 50px;
      text-align: center;
      font-size: 0.8rem;
      color: rgba(255, 255, 255, 0.3);
      border-top: 1px solid rgba(255, 255, 255, 0.02);
      letter-spacing: 1px;
      background: #03050a;
    }

    @media (max-width: 768px) {
      nav { padding: 25px 30px; }
      nav div { gap: 20px; }
      .brand-title { font-size: 1.2rem; letter-spacing: 5px; }
      .hero h1 { font-size: 2.6rem; letter-spacing: 6px; }
      .hero p { font-size: 1rem; }
      section { padding: 90px 24px; }
      .contact-info { grid-template-columns: 1fr; gap: 30px; }
    }
  </style>
</head>
<body>

  <!-- NAVBAR -->
  <nav>
    <div class="brand-title">Fly Roye</div>
    <div>
      <a href="#destinations">Ziele</a>
      <a href="#experiences">Erlebnisse</a>
      <a href="#packages">Pakete</a>
